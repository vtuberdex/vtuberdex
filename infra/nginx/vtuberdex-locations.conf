# Locations comunes de VTuberDex (HTTP y HTTPS). Nada aquí sirve archivos del disco: todo pasa
# por la app. (www-data tampoco puede leer `app/` del release: ver scripts/release.sh.)
# Seguridad (anadido 2026-10-10): limites por IP + cabeceras. Las zonas estan en conf.d/00-seguridad.conf.
limit_req zone=vtd_web burst=100 nodelay;
limit_req zone=vtd_api burst=20 nodelay;
limit_req zone=vtd_img burst=60 nodelay;
limit_conn vtd_conn 80;
# Anti-scraping: ver conf.d/00-seguridad.conf
if ($vtd_bloquear_ua)     { return 403; }
if ($vtd_bloquear_origen) { return 403; }
include /etc/nginx/snippets/vtuberdex-seguridad.conf;
gzip on;
gzip_types application/json text/css application/javascript image/svg+xml;
gzip_min_length 512;

# Trampa anti-scraping: enlace invisible del pie (components/app-footer.tsx). fail2ban banea a quien llega.
location = /v/archivo-completo { return 403; }

# Assets con hash en el nombre: inmutables, se cachean en nginx y en el navegador.
# Host FIJO, no el que manda quien llama: la cabecera Host la controla quien llama (Semgrep: request-host-used). La app
# saca su URL de SITE_URL, no de Host, y nginx solo atiende vtuberdex.com y www, así que no cambia nada.
location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host vtuberdex.com;
    proxy_cache vtuberdex;
    proxy_cache_valid 200 365d;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status;
    include /etc/nginx/snippets/vtuberdex-seguridad.conf;
}

# Imágenes: salen de BLOBs en SQLite. La clave incluye ?v=, así que un reemplazo del mantenedor
# (URL versionada) no sirve la copia vieja. Respeta el Cache-Control de la app.
location ^~ /images/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host vtuberdex.com;
    proxy_cache vtuberdex;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache $upstream_cache_status;
    include /etc/nginx/snippets/vtuberdex-seguridad.conf;
}

# Mapa del mundo de Minecraft (BlueMap, servidor web interno en 127.0.0.1:8100; anadido 2026-10-13).
# /mapa -> /mapa/ para que las rutas relativas del visor resuelvan bien.
location = /mapa { return 301 /mapa/; }
location ^~ /mapa/ {
    proxy_pass http://127.0.0.1:8100/;
    proxy_set_header Host vtuberdex.com;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;
}
