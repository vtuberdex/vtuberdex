# Locations comunes de VTuberDex (HTTP y HTTPS). Nada aquí sirve archivos del disco: todo pasa
# por la app. (www-data tampoco puede leer `app/` del release: ver scripts/release.sh.)
# Seguridad (anadido 2026-10-10): limites por IP + cabeceras. Las zonas estan en conf.d/00-seguridad.conf.
limit_req zone=vtd_web burst=400 nodelay;
limit_req zone=vtd_api burst=20 nodelay;
limit_req zone=vtd_img burst=400 nodelay;
limit_conn vtd_conn 80;
# Anti-scraping: ver conf.d/00-seguridad.conf
if ($vtd_bloquear_ua)     { return 403; }
if ($vtd_bloquear_origen) { return 403; }
include /etc/nginx/snippets/vtuberdex-seguridad.conf;
# Compresión (2026-11-19): Brotli primero (~15-20 % menos que gzip en JS/CSS) y gzip de respaldo.
# Node responde SIN comprimir (Accept-Encoding vacío hacia el upstream, abajo y en vtuberdex-proxy.conf):
# si Next comprime, nginx no recomprime y Brotli no llegaría nunca. RSC viaja como text/x-component.
gzip on;
gzip_comp_level 5;
gzip_proxied any;
gzip_vary on;
gzip_types application/json text/css application/javascript text/javascript image/svg+xml text/plain text/x-component application/manifest+json;
gzip_min_length 512;
brotli on;
brotli_comp_level 5;
brotli_types application/json text/css application/javascript text/javascript image/svg+xml text/plain text/x-component application/manifest+json;
brotli_min_length 512;

# Trampa anti-scraping: enlace invisible del pie (components/app-footer.tsx). fail2ban banea a quien llega.
location = /v/archivo-completo { return 403; }

# Assets con hash en el nombre: inmutables, se cachean en nginx y en el navegador.
# Host FIJO, no el que manda quien llama: la cabecera Host la controla quien llama (Semgrep: request-host-used). La app
# saca su URL de SITE_URL, no de Host, y nginx solo atiende vtuberdex.com y www, así que no cambia nada.
# Assets con hash en el nombre (2026-11-19): se sirven del DISCO, ya comprimidos en el release
# (scripts/precomprimir.mjs: Brotli 11 + gzip 9). Solo la copia publico/_next/static, que es lo mismo
# que cualquiera ya baja; app/ sigue cerrada. Si falta un archivo (release viejo, chunk de otro build)
# vuelve a Node como antes.
location ^~ /_next/static/ {
    root /var/www/vtuberdex.com/publico;
    brotli_static on;
    gzip_static on;
    try_files $uri @vtd_next_static;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Cache "DISCO";
    include /etc/nginx/snippets/vtuberdex-seguridad.conf;
}
location @vtd_next_static {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host vtuberdex.com;
    proxy_set_header Accept-Encoding "";
    proxy_cache vtuberdex;
    proxy_cache_valid 200 365d;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status;
    include /etc/nginx/snippets/vtuberdex-seguridad.conf;
}

# Imágenes: salen de BLOBs en SQLite. La clave incluye ?v=, así que un reemplazo del mantenedor
# (URL versionada) no sirve la copia vieja. Respeta el Cache-Control de la app.
location ^~ /images/ {
    proxy_pass http://127.0.0.1:3100;
    proxy_set_header Host vtuberdex.com;
    proxy_cache vtuberdex;
    proxy_cache_valid 200 5m;
    proxy_cache_lock on;
    proxy_cache_use_stale error timeout updating;
    add_header X-Cache $upstream_cache_status;
    include /etc/nginx/snippets/vtuberdex-seguridad.conf;
}

# Mapa del mundo de Minecraft (BlueMap, servidor web interno en 127.0.0.1:8100; anadido 2026-10-13).
# /mapa -> /mapa/ para que las rutas relativas del visor resuelvan bien.
# /mapa/ lo escribe vtuberdex-https en vtuberdex-mapa.conf: proxy a BlueMap mientras mapa.vtuberdex.com no
# tenga DNS y certificado; después, 301 al subdominio (BlueMap es de terceros y no debe compartir origen con
# la web, que guarda la sesión del mantenedor: auditoría 2026-11-19).
include /etc/nginx/snippets/vtuberdex-mapa.conf;

# Subida de plugins (.jar) desde el panel del mantenedor: hasta 100 MB SOLO en esta ruta (añadido por Miyuki, 2026-11-08).
# El resto del sitio conserva el límite por defecto (1 MB): los formularios públicos no deben aceptar cuerpos enormes.
# La app aplica además su propio límite (LIMITE_JAR_BYTES en lib/minecraft-admin.mjs); hay que subirlo ahí para pasar de ese tamaño.
location = /api/minecraft-admin/plugins {
    client_max_body_size 100m;
    include /etc/nginx/snippets/vtuberdex-proxy.conf;
}

# Explorador y terminal del panel de Minecraft (2026-11-20, ver minecraft-agente/LEEME.md). Sin el límite
# de /api (5 r/s): la terminal manda lo tecleado en peticiones cortas y el explorador sube carpetas archivo
# a archivo. Solo responden con la sesión del mantenedor. Subidas hasta 1 GB sin búfer en disco; la
# salida de la terminal es un stream (SSE) que no debe quedarse en el búfer de nginx.
location ^~ /api/minecraft-admin/fs {
    limit_req zone=vtd_web burst=400 nodelay;
    client_max_body_size 1024m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    include /etc/nginx/snippets/vtuberdex-proxy.conf;
}
location ^~ /api/minecraft-admin/terminal {
    limit_req zone=vtd_web burst=400 nodelay;
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_read_timeout 3600s;
    include /etc/nginx/snippets/vtuberdex-proxy.conf;
}
