# Limites por IP, timeouts y TLS. Loopback y la VPN (wireguard) no se limitan.
geo $vtd_limitar {
    default          1;
    127.0.0.1        0;
    ::1              0;
    10.8.0.0/24      0;
    fd42:42:42::/64  0;
}
map $vtd_limitar $vtd_clave {
    1 $binary_remote_addr;
    0 "";
}
# /api y /admin: limite mas estricto (clave vacia = no se cuenta)
map "$vtd_limitar:$uri" $vtd_clave_api {
    ~^1:/(api|admin)(/|$) $binary_remote_addr;
    default "";
}
limit_req_zone  $vtd_clave      zone=vtd_web:20m     rate=30r/s;
limit_req_zone  $vtd_clave_api  zone=vtd_api:10m     rate=5r/s;
limit_req_zone  $vtd_clave      zone=sonar_login:5m  rate=10r/m;
limit_conn_zone $vtd_clave      zone=vtd_conn:20m;
limit_req_status  429;
limit_conn_status 429;

# Contra conexiones lentas (slowloris)
client_header_timeout 10s;
client_body_timeout   10s;
send_timeout          15s;
keepalive_timeout     30s;
reset_timedout_connection on;

# TLS
ssl_session_cache   shared:SSL:20m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# ---- Anti-scraping (anadido 2026-10-20) --------------------------------------------------------
# Capa barata: corta librerias de scraping, bots de SEO/IA y peticiones sin UA. No es una barrera
# real (el UA se falsifica); sube el coste del scraper ingenuo. Loopback/VPN ($vtd_limitar=0) exentos.
map $http_user_agent $vtd_ua_scraper {
    default 0;
    ""      1;
    ~*(python-requests|python-urllib|python-httpx|aiohttp|httpx|scrapy|curl/|wget|libwww|go-http-client|okhttp|node-fetch|axios|undici|java/|headlesschrome|phantomjs|puppeteer|playwright|selenium|httrack|scannercli|masscan|nikto|sqlmap) 1;
    ~*(ahrefsbot|semrushbot|mj12bot|dotbot|petalbot|bytespider|gptbot|claudebot|ccbot|amazonbot|reflectionbot|perplexitybot|dataforseo|barkrowler|blexbot|imagesiftbot) 1;
}
# Buscadores y previsualizadores de enlaces legitimos (por UA; no verificable, pero basta aqui).
map $http_user_agent $vtd_ua_bueno {
    default 0;
    ~*(googlebot|bingbot|duckduckbot|applebot|facebookexternalhit|twitterbot|discordbot|slackbot|whatsapp|telegrambot|linkedinbot) 1;
}
# Un navegador siempre manda Sec-Fetch-Site (o, los muy viejos, Referer) al pedir API e imagenes.
map "$http_sec_fetch_site$http_referer" $vtd_sin_origen {
    ""      1;
    default 0;
}
map "$vtd_limitar:$vtd_ua_scraper" $vtd_bloquear_ua {
    "1:1"   1;
    default 0;
}
map "$vtd_limitar:$vtd_sin_origen:$vtd_ua_bueno:$uri" $vtd_bloquear_origen {
    ~^1:1:0:/(api/vtubers|images/) 1;
    default 0;
}
# Imagenes: techo propio por IP (un libro de 8 cartas pide ~20; el catalogo entero son ~1.600).
map "$vtd_limitar:$uri" $vtd_clave_img {
    ~^1:/images/ $binary_remote_addr;
    default "";
}
limit_req_zone $vtd_clave_img zone=vtd_img:10m rate=10r/s;
