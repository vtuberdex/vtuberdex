# Mapa del mundo de Minecraft (BlueMap) en su PROPIO origen (auditoría 2026-11-19). HTTP: el desafío de
# Let's Encrypt (mismo webroot que vtuberdex.com, porque el certificado se amplía) y el mapa. El bloque 443
# lo escribe vtuberdex-https cuando el DNS apunta aquí y el certificado ya lleva este nombre.
server {
    listen 80;
    listen [::]:80;
    server_name mapa.vtuberdex.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vtuberdex.com;
    }
    location / {
        include /etc/nginx/snippets/vtuberdex-mapa-proxy.conf;
    }
}
