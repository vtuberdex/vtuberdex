# Cabeceras de seguridad de VTuberDex. HSTS solo lo respetan los navegadores sobre HTTPS.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Reserva de derechos de minería de datos / entrenamiento de IA (anadido 2026-10-20). Declaracion, no barrera.
add_header X-Robots-Tag "noai, noimageai" always;
add_header tdm-reservation "1" always;
add_header tdm-policy "https://vtuberdex.com/terminos#seguridad" always;
