# Peticiones al catalogo/imagenes rechazadas por nginx con 403 (anti-scraping: UA de libreria, sin origen).
# Los 429 (limit_req por ritmo) NO cuentan: un libro de 8 cartas con precarga los provoca en uso normal y
# baneaban a personas reales (9 IPs residenciales y el mantenedor, medido el 2026-10-21).
[Definition]
failregex = ^<HOST> -.*"(?:GET|HEAD) /(?:api/vtubers|images/)[^"]*" 403 
ignoreregex =
