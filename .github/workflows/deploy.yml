# Despliegue MANUAL a Vercel desde GitHub Actions.
#
# POR QUÉ ESTE WORKFLOW YA NO SE DISPARA EN CADA PUSH
# --------------------------------------------------
# El repo es **público** (desde 2026-10-02) y la GitHub App de Vercel está instalada en la
# organización. Con eso la integración Git SÍ está disponible —antes no: Vercel no conecta
# repos de organizaciones en plan Hobby, y la CLI con token era el único camino— y el
# proyecto `vtuberdex` quedó enlazado a `vtuberdex/vtuberdex` con `productionBranch: master`:
# un push a `master` lo publica Vercel directamente.
#
# Si esto siguiera disparándose en cada push habría DOS deploys por commit compitiendo por el
# alias de producción, y el que termina último gana (puede ser el del commit más viejo). Por eso
# queda solo como `workflow_dispatch`: es el camino de RESPALDO cuando la integración no sirve
# (deployar un commit que Vercel no construyó, reintentar sin pushear, publicar desde una red
# donde la integración no llega) y el ÚNICO camino que exige los gates ANTES de publicar.
#
# OJO CON LOS GATES EN EL CAMINO AUTOMÁTICO: la integración Git construye con el build del repo
# (`next build`), que NO corre lint, typecheck, check:shaders, tests ni `verify`. En el camino
# automático el único aviso es `ci.yml`, y ese no bloquea el deploy de Vercel. Para exigir el
# verde antes de publicar hay que lanzar este workflow a mano.
#
# POR QUÉ EL TOKEN VA EN UN SECRET Y NO EN EL REPO
# ------------------------------------------------
# `VERCEL_TOKEN` es una credencial de cuenta: puede desplegar y leer variables de
# entorno del proyecto. Vive en Settings → Secrets and variables → Actions, nunca en
# el árbol. El workflow falla con un mensaje explícito si no está, en vez de dejar un
# deploy a medias sin decir por qué.
#
# OJO CON LOS GATES: no se despliega si el repo no está verde. `lint` + `typecheck`
# + `test` + `check:shaders` son los gates que NO se cubren entre sí (el límite de
# samplers de GLSL, por ejemplo, no lo ve ninguno: solo la carta negra en el
# navegador; el lint es el único que mira los hooks de React y los imports muertos).
# Es más barato fallar aquí que publicar una carta rota.

name: deploy

on:
  # SOLO a mano (pestaña Actions o `gh workflow run deploy.yml`). El push a `master` ya lo
  # publica la integración Git de Vercel (ver arriba); dejarlo aquí también duplicaría el
  # deploy de cada commit.
  workflow_dispatch:

# Un deploy a la vez. Sin esto, dos lanzamientos seguidos pueden solaparse y dejar en
# producción el commit más VIEJO de los dos (el último en terminar gana).
# `cancel-in-progress: false` a propósito: no se cancela un deploy ya empezado, se
# encola detrás.
concurrency:
  group: deploy-master
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) GATES: nada se despliega si el repo no está verde.
  # ---------------------------------------------------------------------------
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Node 24 en CI, que es lo que corre en Vercel. El `node:sqlite` que usa
          # `server/src/db/index.mjs` exige Node >= 22 y en 24 ya es estable.
          node-version: '24'
          cache: npm
          # El repo es TRES paquetes npm con tres lockfiles. Sin declararlos, la caché
          # solo cubre el de la raíz y los otros dos se reinstalan en cada corrida.
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            scraper/package-lock.json

      # `npm ci` y no `npm install`: respeta el lockfile al pie de la letra, que es lo
      # que hace reproducible el build.
      - name: Instalar dependencias (raíz)
        run: npm ci

      - name: Instalar dependencias (server y scraper)
        run: |
          npm ci --prefix server
          npm ci --prefix scraper

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: check:shaders
        run: npm run check:shaders

      # Los tres paquetes tienen suite propia y corren sin red ni base real: la de web
      # (vitest) sin WebGL, y las de server/scraper contra SQLite temporal y datasets de
      # ejemplo. Se corren las tres porque un deploy publica JUSTAMENTE la base y la
      # búsqueda: un fallo ahí se vería en producción y no en el front.
      - name: tests (web)
        run: npm test

      - name: tests (server)
        run: npm test --prefix server

      - name: tests (scraper)
        run: npm test --prefix scraper

  # ---------------------------------------------------------------------------
  # 2) DEPLOY.
  # ---------------------------------------------------------------------------
  deploy:
    needs: gates
    runs-on: ubuntu-latest
    env:
      # Fijan el proyecto sin `vercel link` interactivo. Son identificadores públicos
      # (están en `.vercel/project.json`), no credenciales: lo secreto es el token.
      VERCEL_ORG_ID: team_fKn351AbkXqpfkgftAQT44OI
      VERCEL_PROJECT_ID: prj_mwKD7oLVWwERnmIWiH9lNBFMhLQy
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Comprobar que existe el token
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::error::Falta el secret VERCEL_TOKEN."
            echo "Créalo en https://vercel.com/account/tokens (scope: el team madkodings-projects)"
            echo "y guárdalo con: gh secret set VERCEL_TOKEN -R vtuberdex/vtuberdex"
            exit 1
          fi

      - name: Instalar Vercel CLI
        run: npm install --global vercel@latest

      # `--prod` compila EN Vercel y publica. Se deja que construya allí en vez de usar
      # `vercel build --prebuilt` para que el build de CI y el de producción sean el
      # MISMO entorno (versión de Node, libvips de `sharp`), que es donde aparecen las
      # diferencias que no se ven en local.
      #
      # `deploy/` viaja en el repo (base saneada + manifiesto) y `outputFileTracingIncludes`
      # de `next.config.mjs` la empaqueta dentro de la función: sin esos dos archivos la
      # app arranca pero cada consulta al catálogo falla.
      - name: Deploy a producción
        run: vercel deploy --prod --yes --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Resumen
        run: echo "Desplegado el commit ${{ github.sha }} a producción." >> "$GITHUB_STEP_SUMMARY"
