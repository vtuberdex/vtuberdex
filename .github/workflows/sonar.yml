# Análisis de seguridad y calidad -> SonarQube (sonar.kodingvibes.com).
#
# Sonar Community Build no hace análisis de taint (SQLi, XSS, path traversal...).
# Lo hacen Semgrep OSS y CodeQL, y sus resultados SARIF se importan a Sonar para
# verlos en un solo panel y poder usarlos en el quality gate.
#
# Secrets requeridos: SONAR_TOKEN y SONAR_HOST_URL (https://sonar.kodingvibes.com).

name: sonar

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Semgrep OSS
        run: |
          pip install semgrep
          semgrep scan \
            --config p/owasp-top-ten --config p/security-audit \
            --config p/javascript --config p/typescript --config p/nodejs \
            --exclude node_modules --exclude .next --exclude deploy --exclude data \
            --exclude '*.test.*' \
            --sarif --output semgrep.sarif --metrics=off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-semgrep
          path: semgrep.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          languages: javascript-typescript
          queries: security-extended
          # Los tests quedan fuera, igual que en sonar.exclusions: sus datos hostiles son a propósito.
          config: |
            paths-ignore:
              - '**/*.test.*'
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v3
        with:
          output: codeql-sarif
      # El SARIF queda en codeql-sarif/javascript.sarif; se renombra para Sonar.
      - run: cp codeql-sarif/javascript.sarif codeql.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-codeql
          path: codeql.sarif

  sonar:
    needs: [semgrep, codeql]
    runs-on: ubuntu-latest
    # El contexto `secrets` no está permitido en `jobs.<job_id>.if` (solo github,
    # needs, vars e inputs). Se leen aquí, en `env`, y el paso de guarda
    # (scripts/check-sonar-secrets.sh) decide: falla si faltan en un run que sí
    # puede recibirlos y solo los omite en PR desde forks, que no los reciben.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
    permissions:
      contents: read
      checks: write # decoración del PR (Sonar)
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar necesita el historial para atribuir código nuevo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cobertura (vitest)
        run: npx vitest run --coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      # Sonar no aplica sonar.issue.ignore.multicriteria a los issues importados de SARIF:
      # se quitan aquí los ya revisados, con la misma lista (scripts/lib/filtrar-sarif.mjs).
      - name: Quitar del SARIF los hallazgos revisados
        run: node scripts/filtrar-sarif.mjs sarif/codeql.sarif sarif/semgrep.sarif
      # La guarda falla si faltan los secretos en un run que sí puede recibirlos
      # (push, PR del mismo repositorio, incluidos los que abre Dependabot) y solo
      # deja pasar el skip en PR desde forks, que no reciben los del repo base.
      - name: Comprobar secretos de Sonar
        id: guarda-sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          GITHUB_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: bash scripts/check-sonar-secrets.sh
      - uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        if: steps.guarda-sonar.outputs.skip != 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # Falla el job si el quality gate no pasa.
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        if: steps.guarda-sonar.outputs.skip != 'true'
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
