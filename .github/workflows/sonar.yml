# Análisis de seguridad y calidad -> SonarQube (sonar.kodingvibes.com).
#
# Sonar Community Build no hace análisis de taint (SQLi, XSS, path traversal...).
# Lo hacen Semgrep OSS y CodeQL, y sus resultados SARIF se importan a Sonar para
# verlos en un solo panel y poder usarlos en el quality gate.
#
# Secrets requeridos: SONAR_TOKEN y SONAR_HOST_URL (https://sonar.kodingvibes.com).

name: sonar

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Semgrep OSS
        run: |
          pip install semgrep
          semgrep scan \
            --config p/owasp-top-ten --config p/security-audit \
            --config p/javascript --config p/typescript --config p/nodejs \
            --exclude node_modules --exclude .next --exclude deploy --exclude data \
            --exclude '*.test.*' \
            --sarif --output semgrep.sarif --metrics=off
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sarif-semgrep
          path: semgrep.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: javascript-typescript
          queries: security-extended
          # Los tests quedan fuera, igual que en sonar.exclusions: sus datos hostiles son a propósito.
          config: |
            paths-ignore:
              - '**/*.test.*'
      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          output: codeql-sarif
      # El SARIF queda en codeql-sarif/javascript.sarif; se renombra para Sonar.
      - run: cp codeql-sarif/javascript.sarif codeql.sarif
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sarif-codeql
          path: codeql.sarif

  sonar:
    needs: [semgrep, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # decoración del PR (Sonar)
      pull-requests: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0 # Sonar necesita el historial para atribuir código nuevo
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cobertura (vitest)
        run: npx vitest run --coverage
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # Falla el job si el quality gate no pasa.
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
