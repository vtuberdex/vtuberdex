# Análisis de seguridad y calidad -> SonarQube (sonar.kodingvibes.com).
#
# Sonar Community Build no hace análisis de taint (SQLi, XSS, path traversal...).
# Lo hacen Semgrep OSS y CodeQL, y sus resultados SARIF se importan a Sonar para
# verlos en un solo panel y poder usarlos en el quality gate.
#
# Secrets requeridos: SONAR_TOKEN y SONAR_HOST_URL (https://sonar.kodingvibes.com).

name: sonar

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Semgrep OSS
        run: |
          pip install semgrep
          semgrep scan \
            --config p/owasp-top-ten --config p/security-audit \
            --config p/javascript --config p/typescript --config p/nodejs \
            --exclude node_modules --exclude .next --exclude deploy --exclude data \
            --exclude '*.test.*' \
            --sarif --output semgrep.sarif --metrics=off
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-semgrep
          path: semgrep.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          languages: javascript-typescript
          queries: security-extended
          # Los tests quedan fuera, igual que en sonar.exclusions: sus datos hostiles son a propósito.
          config: |
            paths-ignore:
              - '**/*.test.*'
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v3
        with:
          output: codeql-sarif
      # El SARIF queda en codeql-sarif/javascript.sarif; se renombra para Sonar.
      - run: cp codeql-sarif/javascript.sarif codeql.sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-codeql
          path: codeql.sarif

  sonar:
    needs: [semgrep, codeql]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # decoración del PR (Sonar)
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Sonar necesita el historial para atribuir código nuevo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Cobertura (vitest)
        run: npx vitest run --coverage
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sarif-*
          path: sarif
          merge-multiple: true
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      # Falla el job si el quality gate no pasa.
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
