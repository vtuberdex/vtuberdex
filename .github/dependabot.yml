version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # TypeScript 7 no tiene typescript-eslint compatible (su peer llega a <6.1): se queda en 6.x
    # hasta que el lint lo soporte. Sin este ignore Dependabot reabre el salto en cada grupo.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-root:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /scraper
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-scraper:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
