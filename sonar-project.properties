# AJUSTAR: debe coincidir con el "Project key" que existe en sonar.kodingvibes.com.
sonar.projectKey=vtuberdex
sonar.projectName=vtuberdex

sonar.sources=app,components,lib,server/src,scraper/src,scripts
sonar.tests=test,components,lib,server/test,scraper/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.test.js
sonar.exclusions=**/node_modules/**,.next/**,deploy/**,data/**,minecraft/**,**/*.test.*

# Duplicación: los diccionarios de traducción (es / en / ja) y los Términos traducidos son
# DATOS con la misma forma a propósito (mismas claves, mismas cláusulas, mismo número de
# párrafos; los tests lo exigen). Sonar normaliza los literales, así que cada traducción
# "duplica" a las otras dos aunque no comparta ni una palabra. Siguen analizándose para
# todo lo demás; solo se sacan del cálculo de duplicados.
sonar.cpd.exclusions=lib/terminos.ts,lib/terminos-en.ts,lib/terminos-ja.ts,lib/i18n/es.ts,lib/i18n/en.ts,lib/i18n/ja.ts,lib/i18n/textos/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Hallazgos de seguridad (inyección, XSS, etc.) que Sonar Community no calcula:
# los producen Semgrep OSS y CodeQL en el workflow y se importan como issues externos.
sonar.sarifReportPaths=sarif/semgrep.sarif,sarif/codeql.sarif

# Hallazgos de CodeQL revisados a mano y descartados como falsos positivos (también cerrados en
# GitHub Security). La supresión en línea `// codeql[...]` no la aplica el extractor de este workflow y
# Sonar no aplica estas exclusiones a lo importado del SARIF, así que el workflow quita antes esos hallazgos
# (scripts/filtrar-sarif.mjs), por regla Y archivo (no se apaga la regla):
#  - safe-write.mjs: escribir lo descargado es el propósito del scraper; writeInside valida la ruta
#    contra su directorio base (scraper/test/ocr-write.test.mjs).
#  - pegar-datos.ts: DOMParser sobre HTML pegado por el admin; documento inerte, sin script/style/iframe/
#    object/embed y solo se lee textContent.
#  - ui.tsx: el src de la imagen pasa por safeImageSrc (http(s), blob:, data:image/* y rutas relativas).
#  - lib/minecraft-admin.mjs: guardar el .jar que sube el mantenedor ES la función del mantenedor. El rol se
#    comprueba antes de leer el cuerpo, el nombre se confina a <servidor>/plugins con resolverRutaEnBase, debe
#    acabar en .jar y el tamaño está acotado (lib/minecraft-admin.test.ts, lib/minecraft-admin-rutas.test.ts).
#  - lib/minecraft-consola.mjs: el registro de auditoría del panel de Minecraft anota quién ejecutó qué, así que
#    escribir datos de la petición ES su función. La ruta es fija (data/minecraft-auditoria.log, no sale de la
#    petición) y cada campo pasa por limpiar(): sin \r, \n ni NUL y con tope de 400 caracteres, así que no se
#    puede forjar otra línea. Apareció en el análisis del PR #88 (2026-11-13).
#  - components/admin/kit-builder.tsx y components/admin/steps/skills-step.tsx (Semgrep, dangerouslySetInnerHTML):
#    la vista previa del kit de habilidades pinta htmlDeEfecto(), que devuelve el HTML ya guardado (el servidor
#    solo acepta la lista blanca de htmlDeHabilidadSeguro) o el texto ESCAPADO; lo de kit-habilidades.ts escapa
#    lo escrito a mano. Es el mismo código que había antes: Semgrep empezó a marcarlo al pasar a subcomponentes
#    (#93), porque su regla trata cualquier prop como entrada de usuario. Solo lo ve el mantenedor.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7
sonar.issue.ignore.multicriteria.e1.ruleKey=external_CodeQL:js/http-to-file-access
sonar.issue.ignore.multicriteria.e1.resourceKey=scraper/src/safe-write.mjs
sonar.issue.ignore.multicriteria.e2.ruleKey=external_CodeQL:js/xss-through-dom
sonar.issue.ignore.multicriteria.e2.resourceKey=components/admin/pegar-datos.ts
sonar.issue.ignore.multicriteria.e3.ruleKey=external_CodeQL:js/xss-through-dom
sonar.issue.ignore.multicriteria.e3.resourceKey=components/admin/ui.tsx
sonar.issue.ignore.multicriteria.e4.ruleKey=external_CodeQL:js/http-to-file-access
sonar.issue.ignore.multicriteria.e4.resourceKey=lib/minecraft-admin.mjs
sonar.issue.ignore.multicriteria.e5.ruleKey=external_CodeQL:js/http-to-file-access
sonar.issue.ignore.multicriteria.e5.resourceKey=lib/minecraft-consola.mjs
sonar.issue.ignore.multicriteria.e6.ruleKey=external_Semgrep OSS:typescript.react.security.audit.react-dangerouslysetinnerhtml.react-dangerouslysetinnerhtml
sonar.issue.ignore.multicriteria.e6.resourceKey=components/admin/kit-builder.tsx
sonar.issue.ignore.multicriteria.e7.ruleKey=external_Semgrep OSS:typescript.react.security.audit.react-dangerouslysetinnerhtml.react-dangerouslysetinnerhtml
sonar.issue.ignore.multicriteria.e7.resourceKey=components/admin/steps/skills-step.tsx
