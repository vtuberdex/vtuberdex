# AJUSTAR: debe coincidir con el "Project key" que existe en sonar.kodingvibes.com.
sonar.projectKey=vtuberdex
sonar.projectName=vtuberdex

sonar.sources=app,components,lib,server/src,scraper/src,scripts
sonar.tests=test,components,lib,server/test,scraper/test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.test.js
sonar.exclusions=**/node_modules/**,.next/**,deploy/**,data/**,minecraft/**,**/*.test.*

# Duplicación: los diccionarios de traducción (es / en / ja) y los Términos traducidos son
# DATOS con la misma forma a propósito (mismas claves, mismas cláusulas, mismo número de
# párrafos; los tests lo exigen). Sonar normaliza los literales, así que cada traducción
# "duplica" a las otras dos aunque no comparta ni una palabra. Siguen analizándose para
# todo lo demás; solo se sacan del cálculo de duplicados.
sonar.cpd.exclusions=lib/terminos.ts,lib/terminos-en.ts,lib/terminos-ja.ts,lib/i18n/es.ts,lib/i18n/en.ts,lib/i18n/ja.ts,lib/i18n/textos/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Hallazgos de seguridad (inyección, XSS, etc.) que Sonar Community no calcula:
# los producen Semgrep OSS y CodeQL en el workflow y se importan como issues externos.
sonar.sarifReportPaths=sarif/semgrep.sarif,sarif/codeql.sarif
