# Drop-in de vtuberdex.service: /etc/systemd/system/vtuberdex.service.d/mc-agente.conf
# La web habla con el agente por su socket; el token sale del mismo archivo que usa el agente.
[Service]
EnvironmentFile=/etc/vtuberdex-mc-agente.env
Environment=VTUBERDEX_MC_AGENTE_SOCKET=/run/vtuberdex-mc-agente/agente.sock
